spring.application.name=tick-tracker
# Web server
server.port=8080
# Database: in-memory H2, rebuilt from the Elanco API on every start
spring.datasource.url=jdbc:h2:mem:ticks
spring.h2.console.enabled=true
# Only touch the database inside services, not while writing the response
spring.jpa.open-in-view=false
# Source API
tick.api.base-url=https://dev-task.elancoapps.com/data